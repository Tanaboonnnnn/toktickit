name: Lab 4 CI

on:
  pull_request:
    branches:
      - lab4-staging
      - main
  push:
    branches:
      - lab4-staging
      - main

permissions:
  contents: read

concurrency:
  group: lab4-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, test, retained E2E and responsive regression
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: toktickit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d toktickit"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/toktickit?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/toktickit_test?schema=public
      SESSION_SECRET: lab4-ci-session-secret-0123456789abcdef0123456789abcdef
      FRONTEND_ORIGIN: http://127.0.0.1:4312

    steps:
      - name: Checkout exact source under verification
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json

      - name: Create isolated test database
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d postgres -c 'CREATE DATABASE toktickit_test;'

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix server ci
          npm --prefix client ci

      - name: Generate Prisma Client
        working-directory: server
        run: npx prisma generate --schema prisma/schema.prisma

      - name: Apply migrations to dedicated test database
        working-directory: server
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/toktickit_test?schema=public
        run: npx prisma migrate deploy --schema prisma/schema.prisma

      - name: Seed E2E reference data in dedicated test database
        working-directory: server
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/toktickit_test?schema=public
        run: npm run prisma:seed > /dev/null

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Verify Lab 4 planning traceability
        run: npm run test:trace:lab4 -- --mode=planning

      - name: Run current Lab 4 aggregate verification
        run: npm run verify

      - name: Record source provenance
        if: always()
        run: |
          echo "event=${{ github.event_name }}"
          echo "source_sha=${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          echo "base_sha=${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || 'n/a' }}"
          echo "ref=${{ github.ref }}"

      - name: Upload Lab 4 current-run browser output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab4-current-run-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: artifacts/lab-04/test-output/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lab4-playwright-diagnostics-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
