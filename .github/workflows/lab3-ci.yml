name: Lab 3 CI

on:
  pull_request:
    branches:
      - lab3-staging
      - main
  push:
    branches:
      - lab3-staging
      - main

permissions:
  contents: read

concurrency:
  group: lab3-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, test, E2E, responsive evidence
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tocktickit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tocktickit"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/toktickit?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/toktickit_test?schema=public
      SESSION_SECRET: lab3-ci-session-secret-0123456789abcdef0123456789abcdef
      FRONTEND_ORIGIN: http://127.0.0.1:4312

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json

      - name: Create isolated test database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -c 'CREATE DATABASE tocktickit_test;'

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix server ci
          npm --prefix client ci

      - name: Generate Prisma Client
        working-directory: server
        run: npx prisma generate --schema prisma/schema.prisma

      - name: Apply migrations to dedicated test database
        working-directory: server
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/toktickit_test?schema=public
        run: npx prisma migrate deploy --schema prisma/schema.prisma

      - name: Seed local-only reference fixtures in test database
        working-directory: server
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/toktickit_test?schema=public
        run: npm run prisma:seed > /dev/null

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Capture SHA-labelled Lab 3 UI evidence
        run: npm run capture:evidence:lab3 -- ci

      - name: Run full Lab 3 verification
        run: npm run verify

      - name: Upload Playwright release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab3-ui-evidence-${{ github.sha }}
          path: artifacts/lab-03/screenshots/issue-52/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Playwright diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lab3-playwright-diagnostics-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
